<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Visual Frames Studio</title>
<!--    <link rel="stylesheet" href="src/main/resources/static/html/CSS/CSS/Login.css" />-->
    <link rel="stylesheet" href="../CSS/Login.css" />
</head>
<body>

<a href="#" class="back-link" id="backLink">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    Back to studio
</a>

<main class="stage">
    <div class="login-card">

        <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E8A33D" stroke-width="1.6">
            <circle cx="12" cy="13" r="4"/>
            <path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/>
          </svg>
        </span>
            <div class="brand-text">
                <div class="brand-title">Visual Frames</div>
                <div class="brand-sub">STUDIO · KANDY, LK</div>
            </div>
        </div>

        <h1 class="login-heading">Welcome back</h1>
        <p class="login-copy">Sign in to manage bookings, view your gallery, or run the studio floor.</p>

        <div class="role-toggle" role="tablist" aria-label="Choose account type">
            <button type="button" class="role-btn is-active" id="roleClient" role="tab" aria-selected="true">
                Client
            </button>
            <button type="button" class="role-btn" id="roleAdmin" role="tab" aria-selected="false">
                Studio staff
            </button>
        </div>

        <form id="loginForm" novalidate>
            <div class="field">
                <label for="email" class="field-label">EMAIL</label>
                <input type="email" id="email" name="email" class="field-input" placeholder="name@example.com" autocomplete="email" />
                <p class="field-error" id="emailError"></p>
            </div>

            <div class="field">
                <label for="password" class="field-label">PASSWORD</label>
                <div class="password-wrap">
                    <input type="password" id="password" name="password" class="field-input" placeholder="Enter your password" autocomplete="current-password" />
                    <button type="button" class="toggle-visibility" id="togglePw" aria-label="Show password">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <p class="field-error" id="passwordError"></p>
            </div>

            <div class="row-between">
                <label class="remember">
                    <input type="checkbox" id="remember" />
                    <span>Keep me signed in</span>
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span id="submitLabel">Sign in as client</span>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 12h14M13 5l7 7-7 7"/>
                </svg>
            </button>

            <div class="status-msg" id="statusMsg" aria-live="polite"></div>
        </form>

        <div class="divider"><span>ƒ/2.8 · NEW HERE?</span></div>

        <p class="signup-line">
            Don't have an account yet?
            <a href="#" id="signupLink">Create one</a>
        </p>
    </div>

    <p class="footer-meta">© 2026 VISUAL FRAMES STUDIO — SECURE SIGN-IN</p>
</main>

<!--<script src="src/main/resources/static/html/CSS/JS/Login.js"></script>-->
<script src="../JS/Login.js"></script>
</body>
</html>
